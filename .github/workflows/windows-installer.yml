name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified WinLibs toolchain
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          $expected = "3c69305081e4a647144339a936244fcf7d3d9e558319e1ad7be2cd2886d4b6a1"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\winlibs.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "WinLibs SHA-256 mismatch." }
          Expand-Archive "$env:RUNNER_TEMP\winlibs.zip" "$env:RUNNER_TEMP\winlibs"
          "COMPILER_DIRECTORY=$env:RUNNER_TEMP\winlibs\mingw64" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Get-ChildItem -Path (Join-Path $programFilesX86 "Inno Setup*\ISCC.exe") -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          "INNO_COMPILER=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build application and installer
        shell: pwsh
        run: |
          .\Build-ZERO-C.ps1 `
            -CompilerDirectory "$env:COMPILER_DIRECTORY" `
            -InnoCompiler "$env:INNO_COMPILER"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-C-Windows-Installer
          path: |
            dist/ZERO-C-Setup-*.exe
            dist/ZERO-C-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ZERO C ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ZERO-C-Setup-*.exe
            dist/ZERO-C-Setup-*.exe.sha256
